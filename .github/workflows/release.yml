name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset: tern-linux-x86_64
          - name: macos-arm64
            os: macos-latest
            asset: tern-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            asset: tern-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make test
          # dynamically linked: the compiled simulator loads models with dlopen
          cc -std=c11 -O2 -o tern src/unity.c
          strip tern
          ./tern --version
          mkdir -p dist && cp tern dist/${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          make test
          cc -std=c11 -O2 -o tern src/unity.c
          strip tern
          ./tern --version
          mkdir -p dist && cp tern dist/${{ matrix.asset }}

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.bat test || exit /b 1
          tern.exe --version || exit /b 1
          if not exist dist mkdir dist
          copy tern.exe dist\${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
